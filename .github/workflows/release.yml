name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Reject a lightweight tag before anything is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TYPE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)
          if [ "$TYPE" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag, so the release has no message to publish"
            exit 1
          fi
      - run: bash scripts/validate-skills.sh
      - run: bash scripts/check-links.sh
      - name: Assert tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          test "$PKG" = "$TAG"
      - name: Publish when the package version is absent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          PKG=$(node -p "require('./package.json').version")
          if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
            echo "Package version already published: $NAME@$PKG"
          else
            npm publish --provenance --access public
          fi
      - name: Create GitHub Release from the annotated tag message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=$GITHUB_REPOSITORY
          TAG=$GITHUB_REF_NAME
          SHA=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)
          MESSAGE=$(gh api "repos/$REPO/git/tags/$SHA" --jq .message | sed '/BEGIN PGP/,/END PGP/d')
          gh release create "$TAG" --title "$TAG" --notes "$MESSAGE"
